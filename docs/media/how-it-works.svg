<text x="40" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#A6B1CF" text-anchor="start">An event takes three hops. Code decides what reaches the model; people approve what changes.</text>
