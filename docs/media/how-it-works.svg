<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1376" width="1180" height="1376" role="img" aria-labelledby="t d">
<title id="t">How the Event Agent MCP SDK works</title>
<desc id="d">An event takes three hops: from an upstream system to the MCP server, from the server to the MCP client host over MCP events, and from the host to the model only if it passes the gates. Side effects are proposed, approved by a human, and run once on the server.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C93FF"/></marker>
